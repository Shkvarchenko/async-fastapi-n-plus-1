services:
  db:
    image: postgres:15
    container_name: pg-container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret_pass
      POSTGRES_DB: dota_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dota_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: fastapi-app
    ports:
      - "8000:8000"
    # ЖДЕМ, пока db станет healthy (здоровой)
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=secret_pass
      - DB_NAME=dota_db

volumes:
  postgres_data: